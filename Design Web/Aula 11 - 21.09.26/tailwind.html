<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Tailwind</title>
        <style>
            .suaclasse{
                font-size: 2rem;
            }
        </style>
    </head>
    <body>
        <h1 class="text-3xl font-bold underline">
        Hello world!
        </h1>
        <p class="font-serif bg-lime-900 text-white px-20 suaclasse w-xs rounded-md shadow-2x1">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aliquam, molestias nobis.</p>
        <!-- px é padding no eixo X e py é padding no eixo Y (P pra tudo) -->
    </body>
    <table class="border-collapse border border-gray-400">
        <thead>
            <tr>
            <th class="border border-gray-300">State</th>
            <th class="border border-gray-300">City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
            <td class="border border-gray-300">Indiana</td>
            <td class="border border-gray-300">Indianapolis</td>
            </tr>
            <tr>
            <td class="border border-gray-300">Ohio</td>
            <td class="border border-gray-300">Columbus</td>
            </tr>
            <tr>
            <td class="border border-gray-300">Michigan</td>
            <td class="border border-gray-300">Detroit</td>
            </tr>
        </tbody>
    </table>
</html>
