<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Eventos com JavaScript</title>
        <style>
            body {
                height: 20rem;
            }
        </style>
    </head>
    <body>
        <h1>Eventos</h1>
        <form action="" name="cadastro">
            <label>Nome: <input type="text" id="nome"></label> <br>
            <label>Cidade:
                <select id="cidade">
                    <option value="natal">Natal</option>
                    <option value="recife">Recife</option>
                    <option value="jp">João Pessoa</option>
                </select>
            </label> <br>
            <input type="submit" value="ENVIAR">
        </form>

        <script>
            document.body.addEventListener("click", function(e) {
                console.log("Evento de click no body.")
            })
            // A área do body vai até onde tem texto, se for muito curto, será necessário modificar a altura no CSS
            // Não preciso trabalhar com getElementById quando é o body, pode trabalhar com a função separadamente
            function eventoclick(){ // aq é a declaração da função
                console.log("Evento click com função separada")
            }
            document.body.addEventListener("click", eventoclick) // evento chamando a função
            // vantagem de separar é pq dá pra reaproveitar a função várias vezes
            
            window.addEventListener("load", function(e){
                console.log("Evento chamado ao carregar a página")
            })

            window.addEventListener("scroll", function(e){
                console.log("Scroll acionado!")
                // para este evento funcionar é necessário ter barra de rolagem
            })

            const nome = document.querySelector("#nome")
            nome.addEventListener("keydown", function(e){
                console.log("Tecla acionada: "+e.key) //o E é uma propriedade nativa do evento :>
            })

            const cidade = document.querySelector("#cidade")
            cidade.addEventListener("change", function(e){
                console.log("Evento Change chamado.")
            })

            window.addEventListener("mousemove", function(e){
                console.log("Evento MOUSEMOVE."+ e.clientX + " " + e.clientY)
            })
            // click, dbclick, mousedown, mouseup, mousemove, mouseover, mouseout.... 

        </script>
    </body>
</html>
